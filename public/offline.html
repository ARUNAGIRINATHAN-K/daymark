<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to Daymark...</title>
    <meta name="theme-color" content="#4338ca" />
    <script>
      // Immediately unregister stale service worker if routed here and return to main React SPA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          var promises = registrations.map(function(r) { return r.unregister(); });
          Promise.all(promises).then(function() {
            window.location.replace('/');
          });
        }).catch(function() {
          window.location.replace('/');
        });
      } else {
        window.location.replace('/');
      }
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #090d16;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .card {
        text-align: center;
        padding: 2rem;
      }
      a {
        color: #818cf8;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Loading Daymark Workspace...</h2>
      <p><a href="/">Click here if you are not redirected automatically</a></p>
    </div>
  </body>
</html>
