services:
  daymark:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  daymark-dev:
    profiles: ["dev"]
    build:
      context: .
      target: development
    command: ["bun", "run", "dev"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - daymark_node_modules:/app/node_modules
    init: true

volumes:
  daymark_node_modules:
